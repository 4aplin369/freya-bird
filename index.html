<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Птички для Фреи</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;background:#d8d9d2;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;touch-action:manipulation}#world{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 8%,#f9f9f2 0%,#e8e9e1 45%,#c8cdc2 100%)}
    .grain{position:absolute;inset:0;opacity:.22;background-image:radial-gradient(#6c7668 .7px,transparent .8px);background-size:9px 9px;pointer-events:none}.ground{position:absolute;bottom:-8vh;left:-5vw;width:110vw;height:22vh;border-radius:50% 50% 0 0;background:#9ba992}
    #treeLeft,#treeRight{position:absolute;z-index:4;bottom:-4vh;width:34vw;max-width:370px;min-width:210px;height:82vh;pointer-events:none}.trunk{position:absolute;bottom:0;left:47%;width:17%;height:74%;border-radius:35px 35px 0 0;background:linear-gradient(90deg,#5c5344,#7c6c56 45%,#4e473b)}.branch{position:absolute;height:7%;border-radius:30px;background:#625847;transform-origin:left center}.b1{width:47%;left:52%;bottom:48%;transform:rotate(-32deg)}.b2{width:43%;left:48%;bottom:64%;transform:rotate(29deg)}.b3{width:38%;left:51%;bottom:30%;transform:rotate(34deg)}.crown{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 25%,#91a27b,#5d755b 65%,#4e6652);box-shadow:inset -12px -12px 17px #435a49}.c1{width:64%;aspect-ratio:1;top:2%;left:6%}.c2{width:72%;aspect-ratio:1;top:14%;left:28%}.c3{width:55%;aspect-ratio:1;top:29%;left:0}.c4{width:55%;aspect-ratio:1;top:35%;left:40%}#treeRight{right:-5vw;transform:scaleX(-1)}#treeLeft{left:-5vw}
    #air{position:absolute;inset:0;z-index:2}.bird{position:absolute;width:clamp(78px,12vw,132px);aspect-ratio:1.35;transform-origin:center;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 7px 5px rgba(32,42,32,.22));will-change:transform}.bird svg{width:100%;height:100%;overflow:visible}.bird .wing{transform-origin:66px 49px;animation:flap .15s ease-in-out infinite alternate}@keyframes flap{to{transform:rotate(-16deg) translateY(-4px)}}.bird:active{scale:1.1}
    .feather{position:absolute;width:10px;height:27px;background:var(--c);border-radius:100% 0 100% 100%;pointer-events:none;z-index:8;animation:feather .7s cubic-bezier(.13,.69,.39,1) forwards}@keyframes feather{to{transform:translate(var(--x),var(--y)) rotate(260deg);opacity:0}}.ring{position:absolute;width:30px;aspect-ratio:1;border:3px solid #fff;border-radius:50%;pointer-events:none;z-index:8;transform:translate(-50%,-50%);animation:ring .5s ease-out forwards}@keyframes ring{to{width:145px;opacity:0}}
    #top{position:absolute;z-index:10;inset:0 0 auto;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}#title{color:#35453b;font-size:clamp(20px,4vw,32px);font-weight:900;letter-spacing:-.04em;text-shadow:0 2px #fff}#sound{pointer-events:auto;border:2px solid #fff;border-radius:17px;background:rgba(255,255,255,.65);color:#35453b;padding:9px 13px;font:800 15px inherit;box-shadow:0 3px 0 rgba(68,84,67,.18)}#hint{position:absolute;z-index:8;bottom:18px;left:50%;translate:-50%;color:#fff;font-size:clamp(14px,2.5vw,20px);font-weight:850;text-shadow:0 2px 3px #435645;white-space:nowrap;pointer-events:none}
    #start{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:rgba(239,240,233,.36);backdrop-filter:blur(2px)}.card{width:min(450px,calc(100% - 36px));padding:34px 27px;border:3px solid #fff;border-radius:31px;background:rgba(255,255,255,.91);text-align:center;box-shadow:0 15px 0 rgba(69,83,67,.16),0 25px 40px rgba(55,68,52,.2)}h1{margin:0;color:#48694d;font-size:clamp(36px,7vw,61px);letter-spacing:-.07em}.card p{font-size:18px;line-height:1.35;font-weight:650}.go{border:0;border-radius:17px;padding:14px 25px;background:#dd7658;color:#fff;box-shadow:0 5px #a44f3c;font:900 19px inherit}.go:active{translate:0 4px;box-shadow:0 1px #a44f3c}
  </style>
</head>
<body><main id="world"><div class="grain"></div><div class="ground"></div><div id="air"></div><div id="treeLeft"><i class="trunk"></i><i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="crown c1"></i><i class="crown c2"></i><i class="crown c3"></i><i class="crown c4"></i></div><div id="treeRight"><i class="trunk"></i><i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="crown c1"></i><i class="crown c2"></i><i class="crown c3"></i><i class="crown c4"></i></div><div id="top"><div id="title">Птички для Фреи</div><button id="sound">🔇 Звук выкл.</button></div><div id="hint">Поймай птичку лапкой 🐾</div><section id="start"><div class="card"><h1>ПТИЧКИ!</h1><p>Птицы всё время летают по экрану и могут скрыться за деревьями.</p><button class="go" id="go">НАЧАТЬ</button></div></section></main>
<script>
  const world=document.querySelector('#world'),air=document.querySelector('#air'),start=document.querySelector('#start'),soundBtn=document.querySelector('#sound');let playing=false,soundOn=false,ctx,birds=[],last=0,spawnTimer,songTimer;
  const palettes=[['#dd7b4b','#80442f'],['#5e91c5','#344f88'],['#e1ba45','#8d6630'],['#c76b78','#833e5b']];
  const svg=(c)=>`<svg viewBox="0 0 150 110" aria-label="Птичка"><path fill="${c[1]}" d="M25 61 2 43l10 31-17 12 31 1z"/><ellipse fill="${c[0]}" cx="77" cy="64" rx="43" ry="29"/><path fill="#f5ead0" d="M53 72c19 12 43 9 56-2-8 27-44 29-56 2z"/><circle fill="${c[0]}" cx="111" cy="43" r="22"/><path fill="#e6a833" d="m130 45 18 7-18 7z"/><circle fill="#222b28" cx="116" cy="38" r="3.5"/><path class="wing" fill="${c[1]}" d="M69 57C48 25 28 23 19 29c12 29 29 49 56 55 12-7 9-18-6-27z"/><path fill="rgba(255,255,255,.32)" d="M58 52C47 39 36 35 29 35c8 16 18 27 33 35z"/></svg>`;
  function chirp(){if(!soundOn)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime;for(let n=0;n<3;n++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(1600+n*450,t+n*.085);o.frequency.exponentialRampToValueAtTime(2700+n*250,t+n*.085+.06);g.gain.setValueAtTime(.028,t+n*.085);g.gain.exponentialRampToValueAtTime(.001,t+n*.085+.08);o.connect(g).connect(ctx.destination);o.start(t+n*.085);o.stop(t+n*.085+.085)}}catch(e){}}
  function puff(x,y,c){for(let i=0;i<15;i++){let f=document.createElement('i'),a=Math.random()*Math.PI*2,d=30+Math.random()*90;f.className='feather';f.style.cssText=`left:${x}px;top:${y}px;--c:${c[i%2]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;world.append(f);setTimeout(()=>f.remove(),760)}let r=document.createElement('i');r.className='ring';r.style.left=x+'px';r.style.top=y+'px';world.append(r);setTimeout(()=>r.remove(),550)}
  function addBird(){if(!playing)return;const c=palettes[Math.floor(Math.random()*palettes.length)],el=document.createElement('div'),fromLeft=Math.random()>.5,w=Math.min(132,Math.max(78,innerWidth*.12)),x=fromLeft?-w:innerWidth+w,y=90+Math.random()*(innerHeight*.63),speed=(115+Math.random()*100)*(fromLeft?1:-1),perchLeft=Math.random()>.5;let b={el,c,x,y,vx:speed,vy:-40+Math.random()*80,w,landed:false,restUntil:0,perch:Math.random()<.62?{x:innerWidth*(perchLeft?.20:.68),y:innerHeight*(perchLeft?.42:.36),side:perchLeft?'left':'right'}:null};el.className='bird';el.innerHTML=svg(c);el.style.width=w+'px';el.addEventListener('pointerdown',e=>{e.preventDefault();if(!playing)return;puff(b.x+b.w/2,b.y+b.w*.45,c);chirp();el.remove();birds=birds.filter(item=>item!==b);setTimeout(addBird,300)});air.append(el);birds.push(b)}
  function animate(t){if(!last)last=t;let dt=Math.min((t-last)/1000,.04);last=t;for(const b of [...birds]){if(b.restUntil){b.x=b.perch.x;b.y=b.perch.y+Math.sin(t/180)*2;if(t>b.restUntil){b.restUntil=0;b.vx=b.perch.side==='left'?145:-145;b.vy=-70+Math.random()*35;chirp()}}else{b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.random()<.014)b.vy+=(-65+Math.random()*130);b.vy=Math.max(-100,Math.min(100,b.vy));if(b.y<82||b.y>innerHeight*.77)b.vy*=-1;if(b.perch&&!b.landed&&((b.vx>0&&b.x>=b.perch.x)||(b.vx<0&&b.x<=b.perch.x))){b.landed=true;b.x=b.perch.x;b.y=b.perch.y;b.vx=0;b.vy=0;b.restUntil=t+1100+Math.random()*1700;chirp()}}if(b.x<-b.w*1.4||b.x>innerWidth+b.w*.4){b.el.remove();birds=birds.filter(item=>item!==b);setTimeout(addBird,350);continue}const flip=b.vx<0?-1:1,angle=b.restUntil?0:Math.max(-11,Math.min(11,b.vy*.09))*flip;b.el.style.transform=`translate(${b.x}px,${b.y}px) scaleX(${flip}) rotate(${angle}deg)`}requestAnimationFrame(animate)}
  function play(){playing=true;start.remove();addBird();setTimeout(addBird,1300);spawnTimer=setInterval(()=>{if(birds.length<3)addBird()},2300);songTimer=setInterval(()=>{if(Math.random()<.55)chirp()},4000);requestAnimationFrame(animate)}document.querySelector('#go').onclick=play;soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 Пение вкл.':'🔇 Звук выкл.';if(soundOn)chirp()};
</script></main></body></html>
