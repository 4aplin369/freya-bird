<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>Птички для Фреи</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overscroll-behavior:none}body{margin:0;overflow:hidden;background:#d8d9d2;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;touch-action:manipulation}#world{position:relative;width:100vw;width:100dvw;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 8%,#f9f9f2 0%,#e8e9e1 45%,#c8cdc2 100%)}#world.calm-world{background:radial-gradient(ellipse at 18% 7%,#697177 0%,transparent 38%),radial-gradient(ellipse at 82% 78%,#353b40 0%,transparent 45%),linear-gradient(145deg,#555d62,#42494e 58%,#30363a)}#world.fish-world{background:radial-gradient(ellipse at 20% 9%,rgba(115,210,213,.45),transparent 36%),radial-gradient(ellipse at 75% 76%,rgba(13,76,86,.62),transparent 48%),linear-gradient(155deg,#3c9fa6,#126a78 55%,#084855)}.calm-world .ground,.calm-world #treeLeft,.calm-world #treeRight,.calm-world .grain,.fish-world .ground,.fish-world #treeLeft,.fish-world #treeRight,.fish-world .grain{opacity:0;transition:opacity .8s ease}.calm-world #title,.calm-world #hint,.fish-world #title,.fish-world #hint{color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.34)}
    .grain{position:absolute;inset:0;opacity:.22;background-image:radial-gradient(#6c7668 .7px,transparent .8px);background-size:9px 9px;pointer-events:none}.ground{position:absolute;bottom:-8vh;left:-5vw;width:110vw;height:22vh;border-radius:50% 50% 0 0;background:#9ba992}
    #treeLeft,#treeRight{position:absolute;z-index:4;bottom:-4vh;width:34vw;max-width:370px;min-width:210px;height:82vh;pointer-events:none}.trunk{position:absolute;bottom:0;left:47%;width:17%;height:74%;border-radius:35px 35px 0 0;background:linear-gradient(90deg,#5c5344,#7c6c56 45%,#4e473b)}.branch{position:absolute;height:7%;border-radius:30px;background:#625847;transform-origin:left center}.b1{width:47%;left:52%;bottom:48%;transform:rotate(-32deg)}.b2{width:43%;left:48%;bottom:64%;transform:rotate(29deg)}.b3{width:38%;left:51%;bottom:30%;transform:rotate(34deg)}.crown{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 25%,#91a27b,#5d755b 65%,#4e6652);box-shadow:inset -12px -12px 17px #435a49}.c1{width:64%;aspect-ratio:1;top:2%;left:6%}.c2{width:72%;aspect-ratio:1;top:14%;left:28%}.c3{width:55%;aspect-ratio:1;top:29%;left:0}.c4{width:55%;aspect-ratio:1;top:35%;left:40%}#treeRight{right:-5vw;transform:scaleX(-1)}#treeLeft{left:-5vw}
    #air{position:absolute;inset:0;z-index:2}.bird{position:absolute;width:clamp(78px,12vw,132px);aspect-ratio:1.35;transform-origin:center;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 7px 5px rgba(32,42,32,.22));will-change:transform}.bird svg{width:100%;height:100%;overflow:visible}.bird .wing{transform-origin:66px 49px;animation:flap .15s ease-in-out infinite alternate}@keyframes flap{to{transform:rotate(-16deg) translateY(-4px)}}.bird:active{scale:1.1}
    .mouse{position:absolute;z-index:6;width:clamp(68px,9vw,106px);aspect-ratio:1.8;pointer-events:auto;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 4px 3px rgba(39,45,34,.2));will-change:transform}.mouse svg{width:100%;height:100%;overflow:visible}.mouse .leg{animation:run .12s ease-in-out infinite alternate;transform-origin:center}@keyframes run{to{transform:translateY(4px) rotate(7deg)}}.calm-feather{position:absolute;z-index:5;width:clamp(58px,8.5vw,118px);height:clamp(132px,19vw,264px);background:url('feather.png') center/contain no-repeat;filter:drop-shadow(0 8px 11px rgba(0,0,0,.2));pointer-events:none;animation:fall var(--fall) linear forwards}@keyframes fall{from{transform:translate(0,-285px) rotate(var(--turn))}to{transform:translate(var(--drift),112vh) rotate(calc(var(--turn) + 125deg));opacity:.36}}.fish{position:absolute;z-index:3;width:clamp(120px,19vw,230px);aspect-ratio:1.5;background:url('fish.png') center/contain no-repeat;filter:drop-shadow(0 10px 9px rgba(0,25,34,.28));cursor:pointer;touch-action:manipulation;will-change:transform,opacity}.fish.dive{opacity:0;scale:.65;transition:opacity .35s,scale .35s}.pond-decor{position:absolute;z-index:4;inset:0;display:none;pointer-events:none}.fish-world .pond-decor{display:block}.rock{position:absolute;bottom:-2%;width:28vw;height:18vh;border-radius:55% 55% 20% 20%;background:linear-gradient(145deg,#78949a,#365e67);box-shadow:inset -14px -12px 20px rgba(0,31,39,.25)}.rock.left{left:-7%}.rock.right{right:-8%;width:23vw}.weed{position:absolute;bottom:-2%;width:22px;height:31vh;border-radius:100% 15%;border-left:12px solid #397f6b;transform-origin:bottom;animation:sway 3.8s ease-in-out infinite alternate}.weed.w1{left:16%;rotate:-12deg}.weed.w2{right:19%;height:25vh;animation-delay:-1.4s}.weed.w3{right:9%;height:36vh;rotate:13deg;animation-delay:-2.2s}@keyframes sway{to{transform:rotate(9deg)}}.bubble{position:absolute;z-index:7;width:18px;aspect-ratio:1;border:2px solid rgba(255,255,255,.8);border-radius:50%;pointer-events:none;animation:bubbleUp 1.25s ease-out forwards}@keyframes bubbleUp{to{transform:translate(var(--bx),-110px) scale(.45);opacity:0}}.feather{position:absolute;width:10px;height:27px;background:var(--c);border-radius:100% 0 100% 100%;pointer-events:none;z-index:8;animation:feather .7s cubic-bezier(.13,.69,.39,1) forwards}@keyframes feather{to{transform:translate(var(--x),var(--y)) rotate(260deg);opacity:0}}.ring{position:absolute;width:30px;aspect-ratio:1;border:3px solid #fff;border-radius:50%;pointer-events:none;z-index:8;transform:translate(-50%,-50%);animation:ring .5s ease-out forwards}@keyframes ring{to{width:145px;opacity:0}}
    #top{position:absolute;z-index:10;inset:0 0 auto;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}#title{color:#35453b;font-size:clamp(20px,4vw,32px);font-weight:900;letter-spacing:-.04em;text-shadow:0 2px #fff}.top-actions{display:flex;gap:8px}#sound,#home{pointer-events:auto;border:2px solid #fff;border-radius:17px;background:rgba(255,255,255,.65);color:#35453b;padding:9px 13px;font:800 15px inherit;box-shadow:0 3px 0 rgba(68,84,67,.18)}#home[hidden]{display:none}#hint{position:absolute;z-index:8;bottom:18px;left:50%;translate:-50%;color:#fff;font-size:clamp(14px,2.5vw,20px);font-weight:850;text-shadow:0 2px 3px #435645;white-space:nowrap;pointer-events:none}
    #start{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:rgba(239,240,233,.36);backdrop-filter:blur(2px)}.card{width:min(450px,calc(100% - 36px));padding:34px 27px;border:3px solid #fff;border-radius:31px;background:rgba(255,255,255,.91);text-align:center;box-shadow:0 15px 0 rgba(69,83,67,.16),0 25px 40px rgba(55,68,52,.2)}h1{margin:0;color:#48694d;font-size:clamp(36px,7vw,61px);letter-spacing:-.07em}.card p{font-size:18px;line-height:1.35;font-weight:650}.buttons{display:flex;justify-content:center;gap:11px;flex-wrap:wrap}.go{border:0;border-radius:17px;padding:14px 20px;background:#dd7658;color:#fff;box-shadow:0 5px #a44f3c;font:900 17px inherit}.quiet{background:#657c95;box-shadow:0 5px #42566b}.go:active{translate:0 4px;box-shadow:0 1px #a44f3c}.quiet:active{box-shadow:0 1px #42566b}
  </style>
</head>
<body><main id="world"><div class="grain"></div><div class="ground"></div><div id="air"></div><div class="pond-decor"><i class="rock left"></i><i class="rock right"></i><i class="weed w1"></i><i class="weed w2"></i><i class="weed w3"></i></div><div id="treeLeft"><i class="trunk"></i><i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="crown c1"></i><i class="crown c2"></i><i class="crown c3"></i><i class="crown c4"></i></div><div id="treeRight"><i class="trunk"></i><i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="crown c1"></i><i class="crown c2"></i><i class="crown c3"></i><i class="crown c4"></i></div><div id="top"><div id="title">Птички для Фреи</div><div class="top-actions"><button id="home" hidden>⌂ Меню</button><button id="sound">🔇 Звук выкл.</button></div></div><div id="hint">Поймай птичку лапкой 🐾</div><section id="start"><div class="card"><h1>ДЛЯ ФРЕИ</h1><p>Выбери охоту, спокойные перья или подводную игру.</p><div class="buttons"><button class="go" id="go">ПТИЧКИ</button><button class="go quiet" id="calm">СПОКОЙНЫЙ РЕЖИМ</button><button class="go quiet" id="fishMode">РЫБКИ</button></div></div></section></main>
<script>
  const world=document.querySelector('#world'),air=document.querySelector('#air'),start=document.querySelector('#start'),soundBtn=document.querySelector('#sound'),homeBtn=document.querySelector('#home'),title=document.querySelector('#title'),hint=document.querySelector('#hint');let playing=false,soundOn=false,mode='hunt',ctx,birds=[],mice=[],fishes=[],last=0,spawnTimer,songTimer,mouseTimer,calmTimer,fishTimer,mouseFromLeft=true,purrSource,purrGain;
  const palettes=[['#dd7b4b','#80442f'],['#5e91c5','#344f88'],['#e1ba45','#8d6630'],['#c76b78','#833e5b']];
  const svg=(c)=>`<svg viewBox="0 0 150 110" aria-label="Птичка"><path fill="${c[1]}" d="M25 61 2 43l10 31-17 12 31 1z"/><ellipse fill="${c[0]}" cx="77" cy="64" rx="43" ry="29"/><path fill="#f5ead0" d="M53 72c19 12 43 9 56-2-8 27-44 29-56 2z"/><circle fill="${c[0]}" cx="111" cy="43" r="22"/><path fill="#e6a833" d="m130 45 18 7-18 7z"/><circle fill="#222b28" cx="116" cy="38" r="3.5"/><path class="wing" fill="${c[1]}" d="M69 57C48 25 28 23 19 29c12 29 29 49 56 55 12-7 9-18-6-27z"/><path fill="rgba(255,255,255,.32)" d="M58 52C47 39 36 35 29 35c8 16 18 27 33 35z"/></svg>`;
  function chirp(){if(!soundOn)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime;for(let n=0;n<3;n++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(1600+n*450,t+n*.085);o.frequency.exponentialRampToValueAtTime(2700+n*250,t+n*.085+.06);g.gain.setValueAtTime(.028,t+n*.085);g.gain.exponentialRampToValueAtTime(.001,t+n*.085+.08);o.connect(g).connect(ctx.destination);o.start(t+n*.085);o.stop(t+n*.085+.085)}}catch(e){}}
  function bubbleSound(){if(!soundOn)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime;for(let n=0;n<2;n++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(260+n*95,t+n*.09);o.frequency.exponentialRampToValueAtTime(95+n*35,t+n*.09+.16);g.gain.setValueAtTime(.07,t+n*.09);g.gain.exponentialRampToValueAtTime(.001,t+n*.09+.18);o.connect(g).connect(ctx.destination);o.start(t+n*.09);o.stop(t+n*.09+.2)}}catch(e){}}
  function startPurr(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(purrSource)return;const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.65;const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain(),lfo=ctx.createOscillator(),lfoGain=ctx.createGain();source.buffer=buffer;source.loop=true;filter.type='lowpass';filter.frequency.value=115;gain.gain.value=.08;lfo.frequency.value=25;lfoGain.gain.value=.026;lfo.connect(lfoGain).connect(gain.gain);source.connect(filter).connect(gain).connect(ctx.destination);source.start();lfo.start();purrSource={source,lfo};purrGain=gain}catch(e){}}function stopPurr(){if(!purrSource)return;purrSource.source.stop();purrSource.lfo.stop();purrSource=null;purrGain=null}
  function addCalmFeather(){if(!playing||mode!=='calm')return;const f=document.createElement('i');f.className='calm-feather';f.style.cssText=`left:${4+Math.random()*92}%;--fall:${18+Math.random()*10}s;--drift:${-48+Math.random()*96}px;--turn:${-28+Math.random()*56}deg`;world.append(f);setTimeout(()=>f.remove(),29000)}
  function bubbles(x,y){for(let i=0;i<9;i++){const b=document.createElement('i');b.className='bubble';b.style.cssText=`left:${x-20+Math.random()*40}px;top:${y-10+Math.random()*30}px;--bx:${-35+Math.random()*70}px`;world.append(b);setTimeout(()=>b.remove(),1350)}}
  function addFish(){if(!playing||mode!=='fish'||fishes.length>=2)return;const el=document.createElement('div'),w=Math.min(230,Math.max(120,innerWidth*.19)),fromLeft=Math.random()>.5;const f={el,w,x:fromLeft?-w:innerWidth+w,y:innerHeight*(.18+Math.random()*.5),vx:(fromLeft?1:-1)*(82+Math.random()*55),vy:-20+Math.random()*40,restUntil:0,nextPause:performance.now()+2500+Math.random()*3500,entered:false};el.className='fish';el.style.width=w+'px';el.addEventListener('pointerdown',e=>{e.preventDefault();if(!playing||mode!=='fish')return;const r=el.getBoundingClientRect();bubbles(r.left+r.width/2,r.top+r.height/2);bubbleSound();el.classList.add('dive');setTimeout(()=>{el.remove();fishes=fishes.filter(item=>item!==f);setTimeout(addFish,650)},360)});air.append(el);fishes.push(f)}
  function puff(x,y,c){for(let i=0;i<15;i++){let f=document.createElement('i'),a=Math.random()*Math.PI*2,d=30+Math.random()*90;f.className='feather';f.style.cssText=`left:${x}px;top:${y}px;--c:${c[i%2]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;world.append(f);setTimeout(()=>f.remove(),760)}let r=document.createElement('i');r.className='ring';r.style.left=x+'px';r.style.top=y+'px';world.append(r);setTimeout(()=>r.remove(),550)}
  const mouseSvg=()=>`<svg viewBox="0 0 160 90" aria-label="Мышка"><path fill="#877f79" d="M25 61C22 36 44 20 79 27c32 6 47 19 49 36-19 16-83 17-103-2z"/><circle fill="#9c938c" cx="54" cy="27" r="15"/><circle fill="#9c938c" cx="88" cy="27" r="15"/><circle fill="#f1c3bd" cx="54" cy="27" r="7"/><circle fill="#f1c3bd" cx="88" cy="27" r="7"/><circle fill="#272c29" cx="110" cy="46" r="4"/><path fill="#eaa0a0" d="m125 55 13 3-12 6z"/><path fill="none" stroke="#877f79" stroke-width="5" stroke-linecap="round" d="M27 60C7 54 1 37 12 28"/><path class="leg" stroke="#514d49" stroke-width="6" stroke-linecap="round" d="m55 68-7 14m38-13 8 13"/></svg>`;
  function addMouse(){if(!playing)return;const w=Math.min(106,Math.max(68,innerWidth*.09)),fromLeft=mouseFromLeft;mouseFromLeft=!mouseFromLeft;const el=document.createElement('div'),m={el,w,x:fromLeft?-w:innerWidth+w,y:innerHeight*.81,vx:(fromLeft?1:-1)*(245+Math.random()*55)};el.className='mouse';el.innerHTML=mouseSvg();el.style.width=w+'px';el.addEventListener('pointerdown',e=>{e.preventDefault();const r=el.getBoundingClientRect();puff(r.left+r.width/2,r.top+r.height/2,['#c9b9aa','#877f79']);el.remove();mice=mice.filter(item=>item!==m)});world.append(el);mice.push(m)}
  function addBird(){if(!playing)return;const c=palettes[Math.floor(Math.random()*palettes.length)],el=document.createElement('div'),fromLeft=Math.random()>.5,w=Math.min(132,Math.max(78,innerWidth*.12)),x=fromLeft?-w:innerWidth+w,y=90+Math.random()*(innerHeight*.63),speed=(115+Math.random()*100)*(fromLeft?1:-1),perchLeft=Math.random()>.5;let b={el,c,x,y,vx:speed,vy:-40+Math.random()*80,w,landed:false,restUntil:0,perch:Math.random()<.62?{x:innerWidth*(perchLeft?.20:.68),y:innerHeight*(perchLeft?.42:.36),side:perchLeft?'left':'right'}:null};el.className='bird';el.innerHTML=svg(c);el.style.width=w+'px';el.addEventListener('pointerdown',e=>{e.preventDefault();if(!playing)return;puff(b.x+b.w/2,b.y+b.w*.45,c);chirp();el.remove();birds=birds.filter(item=>item!==b);setTimeout(addBird,300)});air.append(el);birds.push(b)}
  function animate(t){
    if(!last)last=t;const dt=Math.min((t-last)/1000,.04);last=t;
    if(mode==='hunt'){
      for(const b of [...birds]){
        if(b.restUntil){b.x=b.perch.x;b.y=b.perch.y+Math.sin(t/180)*2;if(t>b.restUntil){b.restUntil=0;b.vx=b.perch.side==='left'?145:-145;b.vy=-70+Math.random()*35;chirp()}}
        else{b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.random()<.014)b.vy+=(-65+Math.random()*130);b.vy=Math.max(-100,Math.min(100,b.vy));if(b.y<82||b.y>innerHeight*.77)b.vy*=-1;if(b.perch&&!b.landed&&((b.vx>0&&b.x>=b.perch.x)||(b.vx<0&&b.x<=b.perch.x))){b.landed=true;b.x=b.perch.x;b.y=b.perch.y;b.vx=0;b.vy=0;b.restUntil=t+1100+Math.random()*1700;chirp()}}
        if(b.x<-b.w*1.4||b.x>innerWidth+b.w*.4){b.el.remove();birds=birds.filter(item=>item!==b);setTimeout(addBird,350);continue}
        const flip=b.vx<0?-1:1,angle=b.restUntil?0:Math.max(-11,Math.min(11,b.vy*.09))*flip;b.el.style.transform=`translate(${b.x}px,${b.y}px) scaleX(${flip}) rotate(${angle}deg)`
      }
      for(const m of [...mice]){m.x+=m.vx*dt;if(m.x<-m.w*1.3||m.x>innerWidth+m.w*.3){m.el.remove();mice=mice.filter(item=>item!==m);continue}m.el.style.transform=`translate(${m.x}px,${m.y}px) scaleX(${m.vx<0?-1:1})`}
    }else if(mode==='fish'){
      for(const f of fishes){
        if(f.restUntil){if(t>f.restUntil){f.restUntil=0;f.vx=(Math.random()>.5?1:-1)*(90+Math.random()*50);f.vy=-24+Math.random()*48;f.nextPause=t+2800+Math.random()*4200}}
        else{f.x+=f.vx*dt;f.y+=f.vy*dt;if(!f.entered&&f.x>10&&f.x<innerWidth-f.w-10)f.entered=true;if(t>f.nextPause&&f.entered){f.restUntil=t+550+Math.random()*850;f.vx=0;f.vy=0}if(f.entered&&f.x<20){f.x=20;f.vx=Math.abs(f.vx)}if(f.entered&&f.x>innerWidth-f.w-20){f.x=innerWidth-f.w-20;f.vx=-Math.abs(f.vx)}if(f.y<75){f.y=75;f.vy=Math.abs(f.vy)}if(f.y>innerHeight-f.w*.7-50){f.y=innerHeight-f.w*.7-50;f.vy=-Math.abs(f.vy)}if(Math.random()<.006)f.vy=Math.max(-55,Math.min(55,f.vy+(-24+Math.random()*48)))}
        const flip=f.vx<0?-1:1,tilt=Math.max(-7,Math.min(7,f.vy*.12))*flip;f.el.style.transform=`translate(${f.x}px,${f.y}px) scaleX(${flip}) rotate(${tilt}deg)`
      }
    }
    requestAnimationFrame(animate)
  }
  function play(selectedMode){playing=true;mode=selectedMode;start.remove();homeBtn.hidden=false;if(mode==='calm'){world.classList.add('calm-world');title.textContent='Спокойный режим';hint.textContent='Можно просто смотреть';soundOn=true;soundBtn.textContent='🔊 Урчание вкл.';startPurr();addCalmFeather();calmTimer=setInterval(addCalmFeather,2300)}else if(mode==='fish'){world.classList.add('fish-world');title.textContent='Рыбки для Фреи';hint.textContent='Коснись рыбки лапкой 🐾';soundOn=true;soundBtn.textContent='🔊 Бульканье вкл.';addFish();fishTimer=setInterval(()=>{if(fishes.length<2&&Math.random()<.34)addFish()},5000)}else{addBird();setTimeout(addBird,1300);setTimeout(addMouse,2200);spawnTimer=setInterval(()=>{if(birds.length<3)addBird()},2300);mouseTimer=setInterval(addMouse,5000);songTimer=setInterval(()=>{if(Math.random()<.55)chirp()},4000)}requestAnimationFrame(animate)}document.querySelector('#go').onclick=()=>play('hunt');document.querySelector('#calm').onclick=()=>play('calm');document.querySelector('#fishMode').onclick=()=>play('fish');homeBtn.onclick=()=>location.reload();soundBtn.onclick=()=>{soundOn=!soundOn;if(mode==='calm'){soundBtn.textContent=soundOn?'🔊 Урчание вкл.':'🔇 Урчание выкл.';if(soundOn)startPurr();else stopPurr()}else if(mode==='fish'){soundBtn.textContent=soundOn?'🔊 Бульканье вкл.':'🔇 Бульканье выкл.'}else{soundBtn.textContent=soundOn?'🔊 Пение вкл.':'🔇 Звук выкл.';if(soundOn)chirp()}};
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});let lastTap=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTap<300)e.preventDefault();lastTap=now},{passive:false});
</script></main></body></html>
